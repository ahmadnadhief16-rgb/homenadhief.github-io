<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDF STORE - Pesanan Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #8e2de2, #4a00e0); color: #fff; }
    .navbar { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); }
    .navbar-brand { color: #fff !important; font-weight: bold; font-size: 1.5rem; }
    .card {
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); background-color: rgba(255, 255, 255, 0.2); }
    .btn-primary { background-color: #ff007f; border: none; }
    .btn-primary:hover { background-color: #ff3399; }
    .product-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
    h2 { text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4); }
    .modal-content { background-color: #2b1a47; color: white; border-radius: 20px; }
    .form-control { background-color: #3d2666; border: none; color: white; }
    .form-control::placeholder { color: #cbb2ff; }
    .btn-secondary { background-color: #6c63ff; border: none; }
    .btn-secondary:hover { background-color: #837dff; }
    footer {
      margin-top: 50px;
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.2);
      color: #ddd;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">💎 NDF STORE</a>
    </div>
  </nav>

  <div class="container py-4">
    <h2 class="text-center mb-4">💠 Daftar Produk Diamond 💠</h2>
    <div class="row" id="product-list"></div>

    <hr class="my-5 border-light">
    <h2 class="text-center mb-4">🛒 Keranjang Belanja</h2>
    <ul class="list-group mb-3" id="cart-list"></ul>
    <div class="text-end">
      <button class="btn btn-primary px-4 py-2 rounded-pill shadow" onclick="checkout()">Checkout</button>
    </div>

    <!-- Modal Checkout -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="checkoutModalLabel">🧾 Formulir Checkout</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="checkoutForm">
              <div class="mb-3">
                <label for="idGame" class="form-label">ID Game</label>
                <input type="text" class="form-control" id="idGame" placeholder="Masukkan ID Game Anda" required>
              </div>
              <div class="mb-3">
                <label for="nama" class="form-label">Nama</label>
                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama Anda" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Masukkan email Anda" required>
              </div>
            </form>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-primary" onclick="confirmCheckout()">Konfirmasi</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 NDF STORE. Semua Hak Dilindungi 💜</p>
  </footer>

  <script>
    const products = [
      { id: 1, name: '70 Diamond', price: 5000, img: 'https://cdn-icons-png.flaticon.com/512/3082/3082031.png' },
      { id: 2, name: '140 Diamond', price: 10000, img: 'https://cdn-icons-png.flaticon.com/512/3082/3082031.png' },
      { id: 3, name: '355 Diamond', price: 15000, img: 'https://cdn-icons-png.flaticon.com/512/3082/3082031.png' },
      { id: 4, name: '720 Diamond', price: 20000, img: 'https://cdn-icons-png.flaticon.com/512/3082/3082031.png' },
      { id: 5, name: '1700 Diamond', price: 25000, img: 'https://cdn-icons-png.flaticon.com/512/3082/3082031.png' }
    ];

    const cart = [];

    const productList = document.getElementById('product-list');

    products.forEach(product => {
      const col = document.createElement('div');
      col.className = 'col-md-4 mb-4';
      col.innerHTML = `
        <div class="card p-4 shadow text-center border-0">
          <img src="${product.img}" alt="${product.name}" class="product-img mx-auto mb-3">
          <h5 class="card-title fw-bold">${product.name}</h5>
          <p class="card-text">💰 Rp${product.price.toLocaleString()}</p>
          <button class="btn btn-primary w-100 rounded-pill" onclick="addToCart(${product.id})">Tambah ke Keranjang</button>
        </div>
      `;
      productList.appendChild(col);
    });

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById('cart-list');
      cartList.innerHTML = '';
      if (cart.length === 0) {
        cartList.innerHTML = '<li class="list-group-item text-center bg-transparent text-light">Keranjang kosong 💨</li>';
        return;
      }
      cart.forEach(item => {
        const li = document.createElement('li');
        li.className = 'list-group-item bg-transparent text-light d-flex justify-content-between align-items-center border-light';
        li.innerHTML = `${item.name} x${item.qty} <span>Rp${(item.price * item.qty).toLocaleString()}</span>`;
        cartList.appendChild(li);
      });
    }

    function checkout() {
      if (cart.length === 0) {
        alert('Keranjang masih kosong!');
        return;
      }
      const modal = new bootstrap.Modal(document.getElementById('checkoutModal'));
      modal.show();
    }

    function confirmCheckout() {
      const idGame = document.getElementById('idGame').value.trim();
      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!idGame || !nama || !email) {
        alert('Harap isi semua data terlebih dahulu!');
        return;
      }

      if (!/^[0-9]+$/.test(idGame)) {
        alert('ID Game hanya boleh berisi angka!');
        return;
      }

      alert(`Pesanan berhasil dikonfirmasi!\nID Game: ${idGame}\nNama: ${nama}\nEmail: ${email}`);
      document.getElementById('checkoutForm').reset();
      cart.length = 0;
      renderCart();
      const modal = bootstrap.Modal.getInstance(document.getElementById('checkoutModal'));
      modal.hide();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
